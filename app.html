<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToinkanAI — App</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F5F0E1;--coral:#F4A261;--gold:#E9C46A;--mint:#A8DADC;--teal:#264653}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;background:var(--cream);color:var(--teal);line-height:1.5}
  h1,h2,h3{font-family:'Literata',serif;font-weight:700}
  header{display:flex;justify-content:space-between;align-items:center;max-width:1120px;margin:0 auto;padding:20px 24px}
  header a{color:var(--teal);font-family:'Literata',serif;font-weight:700;font-size:1.2rem;text-decoration:none}
  main{max-width:1120px;margin:0 auto;padding:0 24px 60px}
  .card{background:#fff8;border:1.5px solid rgba(38,70,83,.14);border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(38,70,83,.08)}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
  label{font-size:.8rem;font-weight:600;display:flex;flex-direction:column;gap:6px}
  input,select{font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid rgba(38,70,83,.25);background:var(--cream);color:var(--teal)}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days label{flex-direction:row;align-items:center;gap:4px;font-weight:500;background:var(--mint);padding:6px 10px;border-radius:999px}
  .btn{font:inherit;font-weight:600;font-size:.9rem;border:0;cursor:pointer;padding:12px 24px;border-radius:999px;background:var(--coral);color:var(--teal);transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.alt{background:var(--teal);color:var(--cream)}
  .btn:disabled{opacity:.5;cursor:wait}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 16px;align-items:center}
  .bar h2{flex:1}
  .week{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .col h3{font-size:.95rem;margin-bottom:8px}
  .s{border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:.8rem;cursor:pointer;border:1.5px solid rgba(38,70,83,.15);background:var(--gold)}
  .s.revisão{background:var(--mint)} .s.simulado{background:var(--coral)}
  .s.done{opacity:.5;text-decoration:line-through}
  .s b{display:block;font-size:.75rem}
  .s small{opacity:.75}
  #msg{margin-top:12px;font-size:.85rem;font-weight:500}
  .hide{display:none}
</style>
</head>
<body>
<header><a href="/">ToinkanAI</a><span style="font-size:.85rem">MVP · <a href="#" id="lPt" style="font-size:.85rem">PT</a> | <a href="#" id="lEn" style="font-size:.85rem">EN</a></span></header>
<main>
  <section class="card" id="onb">
    <h2 data-t="title">Monte seu plano</h2>
    <form id="f">
      <label><span data-t="meta">Meta</span><input name="meta" required minlength="3" maxlength="300" data-tph="metaPh" placeholder="Ex.: passar na prova da OAB"></label>
      <label><span data-t="prazo">Prazo</span><input name="prazo" required data-tph="prazoPh" placeholder="Ex.: 8 semanas ou 2026-12-15"></label>
      <label><span data-t="horas">Horas por dia</span><input name="horas" type="number" min="0.5" max="12" step="0.5" value="2" required></label>
      <label><span data-t="horario">Melhor horário</span><select name="horario"><option value="manha" data-t="manha">Manhã</option><option value="tarde" data-t="tarde">Tarde</option><option value="noite" data-t="noite" selected>Noite</option></select></label>
      <label style="grid-column:1/-1"><span data-t="dias">Dias disponíveis</span><span class="days" id="days"></span></label>
      <div><button class="btn" id="go" data-t="go">Gerar plano</button></div>
    </form>
    <p id="msg"></p>
  </section>
  <section id="plan" class="hide">
    <div class="bar">
      <h2 data-t="semana">Sua semana</h2>
      <button class="btn" id="re" data-t="re">Replanejar semana</button>
      <button class="btn alt" id="ics" data-t="ics">Exportar .ics</button>
    </div>
    <p id="demo" class="hide" style="margin:0 0 14px;padding:10px 14px;border:2px dashed #264653;border-radius:12px;font-size:.85rem;background:#fff" data-t="demo">Modo demonstração: este plano é de exemplo e foi gerado por regras, sem IA. O plano real com Claude chega no beta.</p>
    <div class="week" id="week"></div>
  </section>
</main>
<script>
const DIAS=["seg","ter","qua","qui","sex","sab","dom"], NOMES=I18N.pt.dn;
const $=id=>document.getElementById(id);
const I18N={pt:{title:"Monte seu plano",meta:"Meta",metaPh:"Ex.: passar na prova da OAB",prazo:"Prazo",prazoPh:"Ex.: 8 semanas ou 2026-12-15",horas:"Horas por dia",horario:"Melhor horário",manha:"Manhã",tarde:"Tarde",noite:"Noite",dias:"Dias disponíveis",go:"Gerar plano",semana:"Sua semana",re:"Replanejar semana",ics:"Exportar .ics",demo:"Modo demonstração: este plano é de exemplo e foi gerado por regras, sem IA. O plano real com Claude chega no beta.",loading:L("loading"),err:"Erro",pick:"Escolha ao menos um dia.",estudo:"estudo","revisão":"revisão",simulado:"simulado",dn:["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"]},
en:{title:"Build your plan",meta:"Goal",metaPh:"E.g.: pass the bar exam",prazo:"Deadline",prazoPh:"E.g.: 8 weeks or 2026-12-15",horas:"Hours per day",horario:"Best time of day",manha:"Morning",tarde:"Afternoon",noite:"Evening",dias:"Available days",go:"Generate plan",semana:"Your week",re:"Replan week",ics:"Export .ics",demo:"Demo mode: this is a sample plan generated by rules, without AI. The real Claude-powered plan arrives in the beta.",loading:"Generating…",err:"Error",pick:"Pick at least one day.",estudo:"study","revisão":"review",simulado:"mock exam",dn:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]}};
// idioma escolhido na landing (localStorage "toinkan.lang"); senão, o do navegador
let LANG=localStorage.getItem("toinkan.lang")||((navigator.language||"pt").toLowerCase().startsWith("en")?"en":"pt");
LANG=LANG==="en"?"en":"pt";
const L=k=>I18N[LANG][k];
let state=JSON.parse(localStorage.getItem("toinkan")||"null"); // {plano, sessoes:[{...,feita}]}
$("days").innerHTML=DIAS.map((d,i)=>`<label><input type="checkbox" value="${d}" ${i<5?"checked":""}>${NOMES[i].slice(0,3)}</label>`).join("");
const dayName=i=>L("dn")[i];
const save=()=>localStorage.setItem("toinkan",JSON.stringify(state));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if(!state)return;
  $("plan").classList.remove("hide");
  $("demo").classList.toggle("hide",!state.demo);
  $("week").innerHTML=DIAS.map((d,i)=>{
    const items=state.sessoes.map((s,idx)=>({s,idx})).filter(x=>x.s.dia===d).sort((a,b)=>a.s.inicio.localeCompare(b.s.inicio));
    if(!items.length)return"";
    return`<div class="col"><h3>${dayName(i)}</h3>${items.map(({s,idx})=>`<div class="s ${s.tipo} ${s.feita?"done":""}" data-i="${idx}"><b>${s.inicio}–${s.fim} · ${L(s.tipo)}</b>${esc(s.topico)}</div>`).join("")}</div>`;
  }).join("");
}
$("week").onclick=e=>{const el=e.target.closest(".s");if(!el)return;const s=state.sessoes[el.dataset.i];s.feita=!s.feita;save();render()};

async function call(url,body,btn){
  btn.disabled=true;$("msg").textContent="Gerando…";
  try{
    let j,ok=false;
    try{ // sem backend (ex.: GitHub Pages) cai no modo demo, que roda no navegador
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(r.status!==404&&r.status!==405){j=await r.json();if(!r.ok)throw new Error(j.error||L("err"));ok=true}
    }catch(e){if(!(e instanceof TypeError))throw e}
    if(!ok){const D=await import("/demo.js");j={...(url==="/api/plan"?D.demoPlan(body):D.demoReplan(body)),demo:true}}
    $("msg").textContent="";return j;
  }catch(e){$("msg").textContent=e.message;alert(e.message)}finally{btn.disabled=false}
}
$("f").onsubmit=async e=>{
  e.preventDefault();const f=e.target;
  const dias=[...document.querySelectorAll("#days input:checked")].map(i=>i.value);
  if(!dias.length)return alert(L("pick"));
  const plano={meta:f.meta.value,prazo:f.prazo.value,horas_por_dia:+f.horas.value,dias_disponiveis:dias,melhor_horario:f.horario.value,idioma:LANG};
  const j=await call("/api/plan",plano,$("go")); if(!j)return;
  state={plano,sessoes:j.sessoes,demo:!!j.demo};save();render();
};
$("re").onclick=async()=>{
  const concluidas=state.sessoes.flatMap((s,i)=>s.feita?[i]:[]);
  const j=await call("/api/replan",{plano:state.plano,sessoes:state.sessoes,concluidas},$("re")); if(!j)return;
  const feitas=state.sessoes.filter(s=>s.feita);
  state.demo=state.demo||!!j.demo;
  state.sessoes=[...feitas,...j.sessoes.map(s=>({...s,feita:false}))];save();render();
};
// .ics: ancora a semana na próxima ocorrência de cada dia; repete semanalmente
$("ics").onclick=()=>{
  const pad=n=>String(n).padStart(2,"0"),now=new Date();
  const ev=state.sessoes.map((s,i)=>{
    const d=new Date(now);const target=(DIAS.indexOf(s.dia)+1)%7; // JS: dom=0
    d.setDate(d.getDate()+((target-d.getDay()+7)%7));
    const ymd=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
    const t=h=>h.replace(":","")+"00";
    return["BEGIN:VEVENT",`UID:toinkan-${Date.now()}-${i}@toinkan.online`,`DTSTAMP:${now.toISOString().replace(/[-:]|\.\d+/g,"")}`,
      `DTSTART:${ymd}T${t(s.inicio)}`,`DTEND:${ymd}T${t(s.fim)}`,`SUMMARY:${s.tipo}: ${s.topico.replace(/[,;\n]/g," ")}`,"RRULE:FREQ=WEEKLY;COUNT=4","END:VEVENT"].join("\r\n");
  });
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ToinkanAI//PT","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="toinkan-plano.ics";a.click();
};
function applyLang(){
  document.documentElement.lang=LANG==="en"?"en":"pt-BR";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=L(e.dataset.t));
  document.querySelectorAll("[data-tph]").forEach(e=>e.placeholder=L(e.dataset.tph));
  document.querySelectorAll("#days label").forEach((l,i)=>l.lastChild.textContent=L("dn")[i].slice(0,3));
  if(state)render();
}
const setLang=l=>{LANG=l;localStorage.setItem("toinkan.lang",l);applyLang()};
$("lPt").onclick=e=>{e.preventDefault();setLang("pt")};
$("lEn").onclick=e=>{e.preventDefault();setLang("en")};
applyLang();
</script>
</body>
</html>
